---
argument_specs:
  main:
    short_description: "Installe et configure un serveur RKE2 (mode bootstrap ou join)."
    options:
      rke2_primary:
        type: str
        required: true
        description:
          - "Nom d'inventaire du serveur d'amorçage. Discrimine le mode : inventory_hostname == rke2_primary => BOOTSTRAP, sinon => JOIN."
      rke2_server_url:
        type: str
        default: ""
        description:
          - "Mode JOIN uniquement : endpoint contacté pour rejoindre (ligne `server:`). Ex : https://10.30.1.5:9345."
      rke2_join_token:
        type: str
        default: ""
        description:
          - "Mode JOIN uniquement : token de jointure, fourni par le rôle rke2_fetch_token."
      rke2_version:
        type: str
        default: ""
        description:
          - "Version RKE2 (vide => suit le canal). Ex : v1.31.4+rke2r1."
      rke2_channel:
        type: str
        default: stable
        description:
          - "Canal d'installation RKE2 si rke2_version est vide (stable/latest/...)."
      rke2_install_url:
        type: str
        default: "https://get.rke2.io"
        description:
          - "URL du script d'installation RKE2."
      rke2_config:
        type: dict
        default: {}
        description:
          - "Configuration RKE2 en pass-through, rendue telle quelle dans config.yaml (cni, disable-kube-proxy, cluster-cidr, tls-san, node-ip, disable...). Ne pas y mettre server/token (gérés par le rôle)."
      rke2_bootstrap_timeout:
        type: int
        default: 600
        description:
          - "Délai d'attente du kubeconfig au bootstrap (secondes)."
