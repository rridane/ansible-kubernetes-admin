---
# rke2_kubevip defaults

# Adresse de la VIP de l'API (ARP L2). Requis.
kubevip_vip: ""

# Interface réseau portant la VIP. Vide => auto-détection kube-vip.
kubevip_interface: ""

# Image kube-vip épinglée. Vérifie/bumpe la dernière stable sur ghcr.io/kube-vip.
kubevip_image: "ghcr.io/kube-vip/kube-vip:v0.8.7"

# Variables d'environnement kube-vip supplémentaires (pass-through, nom => valeur).
kubevip_extra_env: {}

# Manifest déposé dans le dossier d'auto-deploy RKE2 (server/manifests).
kubevip_manifest_path: "/var/lib/rancher/rke2/server/manifests/kube-vip.yaml"

# Kubeconfig monté dans le pod kube-vip pour joindre l'apiserver LOCAL (127.0.0.1:6443)
# au lieu de la ClusterIP -> indispensable sous Cilium kube-proxy-free (cf. template).
# RKE2 y écrit un kubeconfig cluster-admin pointant sur https://127.0.0.1:6443.
kubevip_kubeconfig_path: "/etc/rancher/rke2/rke2.yaml"
