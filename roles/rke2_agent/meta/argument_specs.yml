---
argument_specs:
  main:
    short_description: "Installe et configure un agent RKE2 (worker), en mode join."
    options:
      rke2_server_url:
        type: str
        required: true
        description:
          - "Endpoint contacté pour rejoindre (ligne `server:`). Ex : https://10.30.1.5:9345."
      rke2_join_token:
        type: str
        required: true
        description:
          - "Token de jointure, fourni par le rôle rke2_fetch_token."
      rke2_version:
        type: str
        default: ""
        description:
          - "Version RKE2 (vide => suit le canal). Ex : v1.31.4+rke2r1."
      rke2_channel:
        type: str
        default: stable
        description:
          - "Canal d'installation RKE2 si rke2_version est vide (stable/latest/...)."
      rke2_install_url:
        type: str
        default: "https://get.rke2.io"
        description:
          - "URL du script d'installation RKE2."
      rke2_config:
        type: dict
        default: {}
        description:
          - "Configuration RKE2 agent en pass-through (node-ip, node-label, node-taint...). Ne pas y mettre server/token."
