---
# roles/rke2_agent/tasks/main.yml
# Installe et configure un agent RKE2 (worker). Toujours en mode JOIN.
# Le token vient du rôle rke2_fetch_token (rke2_join_token).

- name: "Join | Fail if rke2_server_url is missing"
  ansible.builtin.fail:
    msg: "'rke2_server_url' doit être défini (ex: https://<vip-ou-master>:9345)."
  when: (rke2_server_url | default('') | trim) == ""

- name: "Join | Fail if join token is missing"
  ansible.builtin.fail:
    msg: "'rke2_join_token' doit être fourni (jouer rke2_fetch_token avant)."
  when: (rke2_join_token | default('') | trim) == ""

# --- Installation (get.rke2.io) --------------------------------------------
- name: "Install | Download RKE2 installer"
  ansible.builtin.get_url:
    url: "{{ rke2_install_url }}"
    dest: /usr/local/bin/rke2-install.sh
    mode: "0755"
  become: true

- name: "Install | Run RKE2 installer (agent)"
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2-install.sh
  args:
    creates: /usr/local/bin/rke2
  environment:
    INSTALL_RKE2_TYPE: agent
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
  become: true

# --- Configuration ----------------------------------------------------------
- name: "Config | Ensure /etc/rancher/rke2 exists"
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "Config | Render config.yaml"
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  notify: restart rke2-agent

# --- Service ----------------------------------------------------------------
- name: "Service | Enable and start rke2-agent"
  ansible.builtin.systemd:
    name: rke2-agent
    enabled: true
    state: started
    daemon_reload: true
  become: true
