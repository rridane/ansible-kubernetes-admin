---
# rke2_cilium defaults

# Valeurs Helm de Cilium (pass-through => valuesContent du HelmChartConfig).
# Socle RKE2 kube-proxy-free ; le consommateur étend/surcharge dans ses group_vars.
cilium_values:
  kubeProxyReplacement: true
  k8sServiceHost: "127.0.0.1"      # LB API local RKE2 (pas la VIP) — évite le deadlock
  k8sServicePort: 6443
  l2announcements:
    enabled: true
  k8sClientRateLimit:              # anti-flood API (gotcha connu du L2)
    qps: 10
    burst: 20

# Manifest déposé dans le dossier d'auto-deploy RKE2 (AVANT le start du primaire).
cilium_manifest_path: "/var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml"
